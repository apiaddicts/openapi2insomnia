openapi: "3.0.3"
info:
  title: Petstore Minimal
  description: Minimal fixture for unit tests
  version: "1.0.0"
servers:
  - url: https://api.example.com/v1
tags:
  - name: users
  - name: orders
paths:
  /users:
    get:
      summary: List users
      tags: [users]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create user
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /orders/{orderId}:
    get:
      summary: Get order
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: An order
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    UserInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
